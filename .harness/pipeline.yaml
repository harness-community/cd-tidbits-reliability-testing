pipeline:
  name: Reliability Testing Pipeline
  identifier: Reliability_Testing_Pipeline
  projectIdentifier: YOUR_PROJECT_ID
  orgIdentifier: YOUR_ORG_ID
  tags: {}
  stages:
    - stage:
        name: Build
        identifier: build
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push
                  identifier: build_and_push
                  spec:
                    connectorRef: YOUR_DOCKERHUB_CONNECTOR
                    repo: YOUR_DOCKER_USERNAME/ecommerce-reliability-app
                    tags:
                      - <+pipeline.sequenceId>
                    caching: true
        description: ""
    - stage:
        name: Deploy to Staging
        identifier: deploy_to_staging
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
            serviceInputs: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            environmentInputs: <+input>
            serviceOverrideInputs: <+input>
            infrastructureDefinitions: <+input>
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Deployment
                  identifier: approve_deployment
                  timeout: 1d
                  spec:
                    approvalMessage: Review and approve the deployment to staging.
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account._account_all_users
              - step:
                  type: ShellScript
                  name: Create Namespace
                  identifier: create_namespace
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: kubectl create namespace cd-chaos-staging --dry-run=client -o yaml | kubectl apply -f -
                    environmentVariables: []
                    outputVariables: []
                    executionTarget: {}
                  timeout: 10m
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deploy
                  identifier: rolling_deploy
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback
                  identifier: rollback
                  spec: {}
                  timeout: 10m
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Reliability Validation
        identifier: reliability_validation
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
            serviceInputs: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            environmentInputs: <+input>
            serviceOverrideInputs: <+input>
            infrastructureDefinitions: <+input>
          execution:
            steps:
              - step:
                  type: Chaos
                  name: Pod Delete Experiment
                  identifier: pod_delete_experiment
                  spec:
                    experimentRef: YOUR_CHAOS_EXPERIMENT_ID
                    expectedResilienceScore: 100
                  timeout: 5m
              - step:
                  type: Verify
                  name: CV After Chaos
                  identifier: CV_After_Chaos
                  spec:
                    isMultiServicesOrEnvs: false
                    type: Rolling
                    monitoredService:
                      type: Default
                      spec: {}
                    spec:
                      sensitivity: MEDIUM
                      duration: 5m
                  timeout: 2h
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Verification
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 2h
                            onTimeout:
                              action:
                                type: StageRollback
                    - onFailure:
                        errors:
                          - Unknown
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 2h
                            onTimeout:
                              action:
                                type: Ignore
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback on CV Failure
                  identifier: rollback_on_cv_failure
                  spec: {}
                  timeout: 10m
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  properties:
    ci:
      codebase:
        connectorRef: YOUR_CODE_REPO_CONNECTOR
        build: <+input>
        sparseCheckout: []
